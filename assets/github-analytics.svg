<svg width="1100" height="300" viewBox="0 0 1100 300" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">GitHub analytics snapshot</title>
  <desc id="desc">Stable local analytics-style profile card replacing remote GitHub stats widgets.</desc>
  <defs>
    <linearGradient id="cardBg" x1="0" y1="0" x2="1100" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1e1e2e"/>
      <stop offset="0.55" stop-color="#24243e"/>
      <stop offset="1" stop-color="#302b4d"/>
    </linearGradient>
    <linearGradient id="accent" x1="70" y1="40" x2="1030" y2="260" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#89b4fa"/>
      <stop offset="1" stop-color="#cba6f7"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000000" flood-opacity="0.24"/>
    </filter>
  </defs>

  <rect width="1100" height="300" rx="26" fill="url(#cardBg)"/>
  <rect x="1" y="1" width="1098" height="298" rx="25" stroke="#89b4fa" stroke-opacity="0.2" stroke-width="2"/>
  <circle cx="960" cy="42" r="115" fill="#89b4fa" fill-opacity="0.08"/>
  <circle cx="102" cy="244" r="120" fill="#cba6f7" fill-opacity="0.08"/>

  <text x="60" y="62" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="28" font-weight="800" fill="#89b4fa">
    GitHub Analytics
  </text>
  <text x="60" y="95" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="16" font-weight="500" fill="#c9d1d9">
    Stable local profile card — no external stats widgets, no broken image proxies.
  </text>

  <g filter="url(#shadow)">
    <rect x="60" y="130" width="235" height="105" rx="18" fill="#181825" stroke="#89b4fa" stroke-opacity="0.22"/>
    <rect x="315" y="130" width="235" height="105" rx="18" fill="#181825" stroke="#89b4fa" stroke-opacity="0.22"/>
    <rect x="570" y="130" width="235" height="105" rx="18" fill="#181825" stroke="#89b4fa" stroke-opacity="0.22"/>
    <rect x="825" y="130" width="215" height="105" rx="18" fill="#181825" stroke="#89b4fa" stroke-opacity="0.22"/>
  </g>

  <text x="85" y="166" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="18" font-weight="800" fill="url(#accent)">Backend Focus</text>
  <text x="85" y="198" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="15" fill="#c9d1d9">APIs · Auth · Data Models</text>

  <text x="340" y="166" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="18" font-weight="800" fill="url(#accent)">Full Stack</text>
  <text x="340" y="198" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="15" fill="#c9d1d9">React · Node.js · FastAPI</text>

  <text x="595" y="166" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="18" font-weight="800" fill="url(#accent)">DevOps</text>
  <text x="595" y="198" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="15" fill="#c9d1d9">Docker · CI/CD · Cloud</text>

  <text x="850" y="166" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="18" font-weight="800" fill="url(#accent)">Impact Work</text>
  <text x="850" y="198" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="15" fill="#c9d1d9">Useful products at scale</text>

  <path d="M60 265C160 237 245 247 340 225C440 202 518 155 620 174C725 194 787 251 905 230C975 218 1017 189 1040 164" stroke="url(#accent)" stroke-width="5" stroke-linecap="round"/>
  <g fill="#ffffff">
    <circle cx="60" cy="265" r="5"/>
    <circle cx="340" cy="225" r="5"/>
    <circle cx="620" cy="174" r="5"/>
    <circle cx="905" cy="230" r="5"/>
    <circle cx="1040" cy="164" r="5"/>
  </g>
</svg>
